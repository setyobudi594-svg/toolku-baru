<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Generator Password - ToolKu</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
        }

        .container {
            max-width: 450px;
            margin: 40px auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        .box {
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        #password {
            width: 100%;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-size: 18px;
            margin-bottom: 15px;
        }

        .panjang {
            margin-bottom: 15px;
        }

        .panjang label {
            display: block;
            margin-bottom: 8px;
        }

        #length {
            width: 100%;
        }

        .opsi {
            margin: 15px 0;
        }

        .opsi label {
            display: block;
            margin: 10px 0;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: #111827;
            color: white;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }

        .copy {
            background: #e5e7eb;
            color: #111827;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            text-decoration: none;
            color: #111827;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🔑 Generator Password</h1>

    <div class="box">

        <input
            id="password"
            type="text"
            readonly
            placeholder="Password akan muncul di sini"
        >

        <div class="panjang">

            <label>
                Panjang:
                <strong id="angkaPanjang">16</strong>
            </label>

            <input
                id="length"
                type="range"
                min="6"
                max="50"
                value="16"
                oninput="ubahPanjang()"
            >

        </div>

        <div class="opsi">

            <label>
                <input type="checkbox" id="hurufBesar" checked>
                A-Z
            </label>

            <label>
                <input type="checkbox" id="hurufKecil" checked>
                a-z
            </label>

            <label>
                <input type="checkbox" id="angka" checked>
                0-9
            </label>

            <label>
                <input type="checkbox" id="simbol" checked>
                Simbol
            </label>

        </div>

        <button onclick="buatPassword()">
            🔄 Buat Password
        </button>

        <button class="copy" onclick="salinPassword()">
            📋 Salin Password
        </button>

    </div>

    <a class="back" href="index.html">
        ← Kembali ke ToolKu
    </a>

</div>

<script>

function ubahPanjang() {

    document.getElementById("angkaPanjang").textContent =
        document.getElementById("length").value;

}

function buatPassword() {

    let karakter = "";

    if (document.getElementById("hurufBesar").checked) {
        karakter += "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    }

    if (document.getElementById("hurufKecil").checked) {
        karakter += "abcdefghijklmnopqrstuvwxyz";
    }

    if (document.getElementById("angka").checked) {
        karakter += "0123456789";
    }

    if (document.getElementById("simbol").checked) {
        karakter += "!@#$%^&*()_+-=[]{}";
    }

    if (karakter === "") {
        alert("Pilih minimal satu jenis karakter.");
        return;
    }

    let panjang =
        parseInt(document.getElementById("length").value);

    let hasil = "";

    for (let i = 0; i < panjang; i++) {

        let posisi =
            Math.floor(Math.random() * karakter.length);

        hasil += karakter[posisi];

    }

    document.getElementById("password").value = hasil;

}

function salinPassword() {

    let password =
        document.getElementById("password");

    if (!password.value) {
        alert("Buat password terlebih dahulu.");
        return;
    }

    navigator.clipboard.writeText(password.value);

    alert("Password berhasil disalin.");

}

</script>

</body>
</html>
