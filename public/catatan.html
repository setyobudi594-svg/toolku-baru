<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catatan - ToolKu</title>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --bg: #f2f4f7;
            --card: white;
            --text: #222;
            --input: white;
            --border: #ddd;
            --muted: #555;
        }

        body.dark {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --input: #0f172a;
            --border: #475569;
            --muted: #cbd5e1;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            transition: .25s;
        }

        .container {
            max-width: 500px;
            margin: 30px auto;
            padding: 20px;
            background: var(--card);
            border-radius: 20px;
        }

        h1 {
            text-align: center;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 16px;
            background: var(--input);
            color: var(--text);
        }

        textarea {
            height: 180px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 12px;
            border: none;
            border-radius: 10px;
            background: #222;
            color: white;
            font-size: 16px;
        }

        .hapus {
            background: #d33;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: var(--text);
            text-decoration: none;
        }

        #status {
            text-align: center;
            margin-top: 12px;
            color: var(--muted);
        }
    </style>
</head>

<body>

<div class="container">

    <h1>📝 Catatan</h1>

    <input
        type="text"
        id="judul"
        placeholder="Judul catatan"
    >

    <textarea
        id="isi"
        placeholder="Tulis catatan di sini..."
    ></textarea>

    <button onclick="simpanCatatan()">
        💾 Simpan Catatan
    </button>

    <button class="hapus" onclick="hapusCatatan()">
        🗑️ Hapus Catatan
    </button>

    <div id="status"></div>

    <a href="index.html" class="back">
        ← Kembali ke ToolKu
    </a>

</div>

<script>

function simpanCatatan() {

    let judul = document.getElementById("judul").value;
    let isi = document.getElementById("isi").value;

    localStorage.setItem("judulCatatan", judul);
    localStorage.setItem("isiCatatan", isi);

    document.getElementById("status").innerText =
        "✅ Catatan berhasil disimpan";
}

function bukaCatatan() {

    let judul = localStorage.getItem("judulCatatan");
    let isi = localStorage.getItem("isiCatatan");

    if (judul !== null) {
        document.getElementById("judul").value = judul;
    }

    if (isi !== null) {
        document.getElementById("isi").value = isi;
    }
}

function hapusCatatan() {

    localStorage.removeItem("judulCatatan");
    localStorage.removeItem("isiCatatan");

    document.getElementById("judul").value = "";
    document.getElementById("isi").value = "";

    document.getElementById("status").innerText =
        "🗑️ Catatan dihapus";
}

bukaCatatan();

</script>

<script>
function terapkanTema(){
    document.body.classList.toggle(
        "dark",
        localStorage.getItem("tema") === "dark"
    );
}

terapkanTema();
window.addEventListener("pageshow", terapkanTema);
</script>

</body>
</html>
