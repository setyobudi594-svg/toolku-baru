<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator - ToolKu</title>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --bg: #f2f4f7;
            --card: white;
            --text: #222;
            --input: white;
            --border: #ddd;
        }

        body.dark {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --input: #0f172a;
            --border: #475569;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            transition: .25s;
        }

        .container {
            max-width: 450px;
            margin: 30px auto;
            padding: 20px;
            background: var(--card);
            border-radius: 20px;
        }

        h1 {
            text-align: center;
        }

        .password {
            display: flex;
            gap: 8px;
        }

        #hasil {
            flex: 1;
            padding: 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 16px;
            background: var(--input);
            color: var(--text);
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 12px;
            border: none;
            border-radius: 10px;
            background: #222;
            color: white;
            font-size: 16px;
        }

        .copy {
            width: auto;
            margin-top: 0;
        }

        label {
            display: block;
            margin-top: 18px;
        }

        input[type="range"] {
            width: 100%;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: var(--text);
            text-decoration: none;
        }

        #panjangText {
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🔐 Password Generator</h1>

    <div class="password">
        <input type="text" id="hasil" readonly>
        <button class="copy" onclick="salinPassword()">📋</button>
    </div>

    <label>
        Panjang Password:
        <span id="panjangText">12</span>
    </label>

    <input
        type="range"
        id="panjang"
        min="6"
        max="32"
        value="12"
        oninput="ubahPanjang()"
    >

    <label>
        <input type="checkbox" id="hurufBesar" checked>
        Huruf besar (A-Z)
    </label>

    <label>
        <input type="checkbox" id="angka" checked>
        Angka (0-9)
    </label>

    <label>
        <input type="checkbox" id="simbol" checked>
        Simbol (!@#$)
    </label>

    <button onclick="buatPassword()">
        🔄 Buat Password
    </button>

    <a href="index.html" class="back">
        ← Kembali ke ToolKu
    </a>

</div>

<script>

function ubahPanjang() {

    let panjang = document.getElementById("panjang").value;

    document.getElementById("panjangText").innerText = panjang;
}

function buatPassword() {

    let panjang = Number(
        document.getElementById("panjang").value
    );

    let karakter = "abcdefghijklmnopqrstuvwxyz";

    if (document.getElementById("hurufBesar").checked) {
        karakter += "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    }

    if (document.getElementById("angka").checked) {
        karakter += "0123456789";
    }

    if (document.getElementById("simbol").checked) {
        karakter += "!@#$%^&*()_+-=[]{}";
    }

    let password = "";

    for (let i = 0; i < panjang; i++) {

        let acak = Math.floor(
            Math.random() * karakter.length
        );

        password += karakter[acak];
    }

    document.getElementById("hasil").value = password;
}

function salinPassword() {

    let hasil = document.getElementById("hasil");

    if (hasil.value === "") {
        alert("Buat password terlebih dahulu.");
        return;
    }

    navigator.clipboard.writeText(hasil.value);

    alert("Password berhasil disalin.");
}

buatPassword();

</script>

<script>
function terapkanTema(){
    document.body.classList.toggle(
        "dark",
        localStorage.getItem("tema") === "dark"
    );
}

terapkanTema();
window.addEventListener("pageshow", terapkanTema);
</script>

</body>
</html>
