<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code - ToolKu</title>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --bg: #f2f4f7;
            --card: white;
            --text: #222;
            --input: white;
            --border: #ddd;
        }

        body.dark {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --input: #0f172a;
            --border: #475569;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            transition: .25s;
        }

        .container {
            max-width: 400px;
            margin: 30px auto;
            padding: 20px;
            background: var(--card);
            border-radius: 20px;
        }

        h1 {
            text-align: center;
        }

        textarea {
            width: 100%;
            height: 100px;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--input);
            color: var(--text);
            font-size: 16px;
            resize: none;
        }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 12px;
            border: none;
            border-radius: 10px;
            background: #222;
            color: white;
            font-size: 16px;
        }

        #qrcode {
            text-align: center;
            margin: 25px 0;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 15px;
            text-decoration: none;
            color: var(--text);
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🔳 QR Code</h1>

    <textarea id="text" placeholder="Masukkan teks atau link..."></textarea>
    <div id="charCount"
        style="margin-top:6px;text-align:right;font-size:13px;opacity:.65;">
        0 / 2000 karakter
    </div>
    <div id="qr-action-hint"
        style="margin-top:6px;font-size:12px;opacity:.65;">
        Buat QR Code terlebih dahulu untuk menggunakan tombol aksi.
    </div>

    <div id="qrStatus"
        style="margin-top:10px;text-align:center;font-size:14px;min-height:20px;opacity:.75;"
        aria-live="polite"></div>

    <button onclick="generateQR()">
        Buat QR Code
    </button>

    <div id="qrcode"></div>

    <button id="resetQR" type="button"
        style="margin-top:10px;width:100%;padding:12px;border:1px solid #d1d5db;border-radius:12px;background:transparent;color:inherit;font-size:15px;font-weight:600;cursor:pointer;">
        🔄 Reset QR
    </button>

    <button id="zoomQR" type="button"
        style="display:none;margin-top:10px;width:100%;padding:12px;border:0;border-radius:12px;background:#0f172a;color:#fff;font-size:15px;font-weight:600;cursor:pointer;">
        🔍 Perbesar QR
    </button>

    <div id="qr-actions" style="margin-top:18px;display:none;text-align:center;">
    <div id="qr-secondary-actions"
        style="margin-top:10px;display:flex;gap:10px;">
        <button id="copyQR" type="button"
            style="display:none;flex:1;padding:12px;border:0;border-radius:12px;background:#16a34a;color:#fff;font-size:15px;font-weight:600;cursor:pointer;">
            📋 Salin Isi
        </button>

        <button id="shareQR" type="button"
            style="display:none;flex:1;padding:12px;border:0;border-radius:12px;background:#7c3aed;color:#fff;font-size:15px;font-weight:600;cursor:pointer;">
            📤 Bagikan QR
        </button>
    </div>

        <button id="downloadQR" type="button"
            style="width:100%;padding:14px 18px;border:0;border-radius:12px;background:#2563eb;color:#fff;font-size:16px;font-weight:600;cursor:pointer;">
            ⬇️ Download QR Code
        </button>
    </div>

    <a href="index.html" class="back">
        ← Kembali ke ToolKu
    </a>

</div>


<div id="qrZoomModal"
    style="display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.82);align-items:center;justify-content:center;padding:20px;">

    <div style="position:relative;background:#fff;border-radius:20px;padding:24px;max-width:90vw;text-align:center;">

        <button id="closeQRZoom" type="button"
            style="position:absolute;right:10px;top:10px;width:36px;height:36px;border:0;border-radius:50%;background:#e5e7eb;font-size:20px;cursor:pointer;">
            ×
        </button>

        <div style="font-weight:700;margin:4px 36px 18px 0;color:#111827;">
            QR Code
        </div>

        <div id="qrZoomContent"></div>

    </div>
</div>


<section id="qrHistorySection"
    style="margin-top:24px;text-align:left;">

    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;">
        <strong style="font-size:16px;">🕘 Riwayat QR</strong>

        <button id="clearQRHistory" type="button"
            style="border:0;background:none;color:#dc2626;font-size:13px;cursor:pointer;">
            Hapus semua
        </button>
    </div>

    <div id="qrHistory"
        style="display:flex;flex-direction:column;gap:8px;">
    </div>

    <div id="qrHistoryEmpty"
        style="font-size:13px;opacity:.65;padding:12px 0;">
        Belum ada riwayat QR.
    </div>

</section>

<script src="./qrcode.min.js"></script>

<script>

const QR_HISTORY_KEY = "toolku_qr_history";
const QR_HISTORY_LIMIT = 8;

const historyContainer = document.getElementById("qrHistory");
const historyEmpty = document.getElementById("qrHistoryEmpty");
const clearHistoryButton = document.getElementById("clearQRHistory");

function getQRHistory() {
    try {
        const data = JSON.parse(localStorage.getItem(QR_HISTORY_KEY) || "[]");
        return Array.isArray(data) ? data : [];
    } catch {
        return [];
    }
}

function saveQRHistory(value) {
    const text = value.trim();

    if (!text) return;

    let history = getQRHistory();

    history = history.filter(item => item !== text);
    history.unshift(text);
    history = history.slice(0, QR_HISTORY_LIMIT);

    localStorage.setItem(QR_HISTORY_KEY, JSON.stringify(history));
    renderQRHistory();
}

function renderQRHistory() {
    const history = getQRHistory();

    historyContainer.innerHTML = "";
    historyEmpty.style.display = history.length ? "none" : "block";

    history.forEach(function(value) {
        const row = document.createElement("div");

        row.style.cssText =
            "display:flex;align-items:center;gap:8px;padding:10px;" +
            "border:1px solid #e5e7eb;border-radius:12px;" +
            "background:#fff;";

        const button = document.createElement("button");

        button.type = "button";
        button.textContent =
            value.length > 70 ? value.slice(0, 70) + "…" : value;

        button.title = value;

        button.style.cssText =
            "flex:1;text-align:left;border:0;background:none;" +
            "padding:0;color:#111827;font-size:13px;cursor:pointer;" +
            "overflow:hidden;text-overflow:ellipsis;white-space:nowrap;";

        button.onclick = function() {
            textInput.value = value;
            updateCharCount();
            generateQR();
            window.scrollTo({ top: 0, behavior: "smooth" });
        };

        const remove = document.createElement("button");

        remove.type = "button";
        remove.textContent = "×";
        remove.title = "Hapus dari riwayat";

        remove.style.cssText =
            "width:30px;height:30px;border:0;border-radius:8px;" +
            "background:#fee2e2;color:#dc2626;font-size:18px;cursor:pointer;";

        remove.onclick = function() {
            const updated = getQRHistory().filter(item => item !== value);

            localStorage.setItem(
                QR_HISTORY_KEY,
                JSON.stringify(updated)
            );

            renderQRHistory();
        };

        row.appendChild(button);
        row.appendChild(remove);
        historyContainer.appendChild(row);
    });
}

clearHistoryButton.onclick = function() {
    const history = getQRHistory();

    if (!history.length) return;

    if (!confirm("Hapus semua riwayat QR?")) return;

    localStorage.removeItem(QR_HISTORY_KEY);
    renderQRHistory();
};

renderQRHistory();


const textInput = document.getElementById("text");
const charCount = document.getElementById("charCount");
const MAX_QR_LENGTH = 2000;

const qrStatus = document.getElementById("qrStatus");

function setQRStatus(message, type = "normal") {
    qrStatus.textContent = message;

    if (type === "success") {
        qrStatus.style.opacity = "1";
        qrStatus.style.fontWeight = "600";
    } else if (type === "error") {
        qrStatus.style.opacity = "1";
        qrStatus.style.fontWeight = "600";
    } else {
        qrStatus.style.opacity = ".75";
        qrStatus.style.fontWeight = "400";
    }
}


function updateCharCount() {
    const length = textInput.value.length;
    charCount.textContent = `${length} / ${MAX_QR_LENGTH} karakter`;

    if (length > MAX_QR_LENGTH) {
        charCount.style.opacity = "1";
        charCount.textContent = `${length} / ${MAX_QR_LENGTH} karakter — terlalu panjang`;
    }
}

textInput.addEventListener("input", updateCharCount);
updateCharCount();

const resetButton = document.getElementById("resetQR");

const actionButtons = [
    document.getElementById("downloadQR"),
    document.getElementById("copyQR"),
    document.getElementById("shareQR")
];

actionButtons.forEach(function(button) {
    button.disabled = true;
    button.style.opacity = ".5";
    button.style.cursor = "not-allowed";
});

resetButton.onclick = function() {
    document.getElementById("text").value = "";
    document.getElementById("qrcode").innerHTML = "";
    updateCharCount();
    setQRStatus("");
    document.getElementById("qr-actions").style.display = "none";
    document.getElementById("copyQR").style.display = "none";
    document.getElementById("shareQR").style.display = "none";
    document.getElementById("zoomQR").style.display = "none";
    document.getElementById("qrZoomModal").style.display = "none";

    actionButtons.forEach(function(button) {
        button.disabled = true;
        button.style.opacity = ".5";
        button.style.cursor = "not-allowed";
    });

    document.getElementById("qr-action-hint").textContent =
        "Buat QR Code terlebih dahulu untuk menggunakan tombol aksi.";
    document.getElementById("qr-action-hint").style.opacity = ".65";

    document.getElementById("text").focus();
};

document.getElementById("text").addEventListener("keydown", function(event) {
    if ((event.ctrlKey || event.metaKey) && event.key === "Enter") {
        event.preventDefault();
        generateQR();
    }
});

function generateQR() {

    let text = document.getElementById("text").value;
    let qr = document.getElementById("qrcode");

    qr.innerHTML = "";

    if (text.trim() === "") {
        setQRStatus("Masukkan teks atau link terlebih dahulu.", "error");
        alert("Masukkan teks atau link terlebih dahulu.");
        return;
    }

    if (text.length > MAX_QR_LENGTH) {
        setQRStatus("Teks terlalu panjang. Maksimal 2000 karakter.", "error");
        alert("Teks terlalu panjang. Maksimal 2000 karakter.");
        return;
    }

    setQRStatus("Membuat QR Code...");

    new QRCode(qr, {
        text: text,
        width: 200,
        height: 200
    });

      setQRStatus("QR Code berhasil dibuat", "success");

      saveQRHistory(text);

      const actions = document.getElementById("qr-actions");
      const downloadButton = document.getElementById("downloadQR");
      const copyButton = document.getElementById("copyQR");
      const shareButton = document.getElementById("shareQR");
      const zoomButton = document.getElementById("zoomQR");
      const zoomModal = document.getElementById("qrZoomModal");
      const zoomContent = document.getElementById("qrZoomContent");
      const closeZoom = document.getElementById("closeQRZoom");

      zoomButton.style.display = "block";

      zoomButton.onclick = function() {
          const canvas = qr.querySelector("canvas");

          if (!canvas) {
              alert("QR Code belum siap.");
              return;
          }

          zoomContent.innerHTML = "";

          const preview = document.createElement("img");
          preview.src = canvas.toDataURL("image/png");
          preview.alt = "QR Code ToolKu";
          preview.style.width = "min(320px, 70vw)";
          preview.style.height = "auto";
          preview.style.imageRendering = "pixelated";
          preview.style.display = "block";

          zoomContent.appendChild(preview);
          zoomModal.style.display = "flex";
      };

      closeZoom.onclick = function() {
          zoomModal.style.display = "none";
      };

      zoomModal.onclick = function(event) {
          if (event.target === zoomModal) {
              zoomModal.style.display = "none";
          }
      };

      actions.style.display = "block";
      copyButton.style.display = "block";
      shareButton.style.display = "block";

      actionButtons.forEach(function(button) {
          button.disabled = false;
          button.style.opacity = "1";
          button.style.cursor = "pointer";
      });

      document.getElementById("qr-action-hint").textContent =
          "QR Code siap digunakan.";
      document.getElementById("qr-action-hint").style.opacity = "1";

      copyButton.onclick = async function() {
          const value = document.getElementById("text").value;

          try {
              await navigator.clipboard.writeText(value);
              copyButton.textContent = "✅ Tersalin";
              setTimeout(() => {
                  copyButton.textContent = "📋 Salin Isi";
              }, 1500);
          } catch (error) {
              alert("Tidak bisa menyalin otomatis.");
          }
      };

      shareButton.onclick = async function() {
          const canvas = qr.querySelector("canvas");

          if (!canvas) {
              alert("QR Code belum siap untuk dibagikan.");
              return;
          }

          if (!navigator.share) {
              alert("Fitur berbagi tidak didukung browser ini. Gunakan Download QR Code.");
              return;
          }

          try {
              const blob = await new Promise(resolve =>
                  canvas.toBlob(resolve, "image/png")
              );

              if (!blob) {
                  alert("Gagal menyiapkan QR Code.");
                  return;
              }

              const file = new File(
                  [blob],
                  "toolku-qrcode.png",
                  { type: "image/png" }
              );

              const shareData = {
                  title: "ToolKu QR Code",
                  text: document.getElementById("text").value
              };

              if (navigator.canShare && navigator.canShare({ files: [file] })) {
                  shareData.files = [file];
              }

              await navigator.share(shareData);

          } catch (error) {
              if (error.name !== "AbortError") {
                  alert("QR Code gagal dibagikan.");
              }
          }
      };

      downloadButton.onclick = function() {
          const canvas = qr.querySelector("canvas");

          if (!canvas) {
              alert("QR Code belum siap untuk disimpan.");
              return;
          }

          canvas.toBlob(function(blob) {
              if (!blob) {
                  alert("Gagal membuat file QR Code.");
                  return;
              }

              const url = URL.createObjectURL(blob);
              const a = document.createElement("a");

              a.href = url;
              a.download = "toolku-qrcode.png";
              document.body.appendChild(a);
              a.click();
              a.remove();

              setTimeout(function() {
                  URL.revokeObjectURL(url);
              }, 1000);
          }, "image/png");
      };
}

</script>

<script>
function terapkanTema(){
    document.body.classList.toggle(
        "dark",
        localStorage.getItem("tema") === "dark"
    );
}

terapkanTema();
window.addEventListener("pageshow", terapkanTema);
</script>

</body>
</html>
